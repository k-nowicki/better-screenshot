name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config gettext desktop-file-utils \
            libgtk-3-dev libhandy-1-dev libglib2.0-dev libx11-dev libxext-dev

      - name: Configure
        run: meson setup _build

      - name: Build
        run: ninja -C _build

      - name: Install into a staging prefix
        run: DESTDIR="$PWD/_stage" ninja -C _build install

      - name: Check the desktop entry and the schema
        run: |
          desktop-file-validate _stage/usr/local/share/applications/*.desktop
          glib-compile-schemas --strict --dry-run _stage/usr/local/share/glib-2.0/schemas
