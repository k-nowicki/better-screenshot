name: Release

# Tag a commit as v1.0.0 to build the package and publish it.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            devscripts debhelper dpkg-dev lintian \
            meson ninja-build pkg-config gettext desktop-file-utils \
            libgtk-3-dev libhandy-1-dev libglib2.0-dev libx11-dev libxext-dev

      - name: Build the package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect the artifacts
        run: |
          mkdir -p dist
          mv ../better-screenshot_*.deb dist/
          ls -la dist

      - name: Lint the package
        run: lintian --no-tag-display-limit dist/*.deb || true

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

      - name: Attach the package to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
