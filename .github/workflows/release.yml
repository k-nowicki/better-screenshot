name: Release

# Tag a commit as v1.0.0 to build the package and publish it.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential devscripts equivs lintian

      # Installing from debian/control rather than repeating the list here
      # keeps one source of truth: a build dependency added to the package can
      # not go missing from CI.
      - name: Install the build dependencies declared in debian/control
        run: |
          sudo mk-build-deps --install --remove \
            --tool "apt-get -y --no-install-recommends" debian/control

      - name: Build the package
        run: dpkg-buildpackage -us -uc -b

      - name: Collect the artifacts
        run: |
          mkdir -p dist
          mv ../better-screenshot_*.deb dist/
          ls -la dist

      - name: Lint the package
        run: lintian --tag-display-limit 0 dist/*.deb || true

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

      - name: Attach the package to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
